name: Daily Automated Run

# 1. 자동 실행 조건 (일정 시간마다)
on:
  schedule:
    # UTC 기준 시간 설정 (한국 시간 = UTC + 9시간)
    # 예: 한국 시간으로 매일 아침 9시 실행 -> UTC로는 매일 00시 (00 00 * * *)
    - cron: '10 0 * * *'
  
  # 수동으로도 실행할 수 있게 버튼을 만들어둡니다 (테스트용)
  workflow_dispatch:

# 2. 실행할 작업(Job) 정의
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 저장소 코드 가져오기
      - name: Check out repository
        uses: actions/checkout@v4

      # 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 필요한 패키지 설치 (requirements.txt가 있는 경우)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 실제 파일 실행 (main.py 부분을 실행하려는 파일명으로 변경)
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_gems_pipeline.py
